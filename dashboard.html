<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura - Dashboard Sensorial</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --dark: #050505;
            --panel: rgba(15, 15, 15, 0.95);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--dark);
            font-family: 'Lato', sans-serif;
            color: white; overflow: hidden;
            user-select: none;
        }

        #fireCanvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1;
            background: radial-gradient(circle at bottom, #1a0f05 0%, #050505 80%);
        }

        .ui-overlay {
            position: relative; z-index: 10;
            height: 100%; display: flex;
            flex-direction: column; justify-content: space-between;
            padding: 40px; box-sizing: border-box;
            transition: opacity 0.8s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-family: 'Urbanist', sans-serif;
            font-size: 24px; letter-spacing: 12px;
            font-weight: 300; margin: 0; color: var(--gold);
        }

        /* Botón de cerrar sesión minimalista */
        .logout-btn {
            font-family: 'Urbanist', sans-serif;
            font-size: 10px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            background: none;
            border: none;
            cursor: pointer;
            transition: color 0.3s ease;
            padding: 10px;
        }

        .logout-btn:hover {
            color: var(--gold);
        }

        .controls-panel {
            background: var(--panel);
            backdrop-filter: blur(40px);
            padding: 40px; border-radius: 40px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            max-width: 420px; margin: 0 auto;
            width: 100%; box-shadow: 0 50px 100px rgba(0,0,0,0.9);
        }

        .control-group { margin-bottom: 25px; }

        .control-label {
            display: flex; justify-content: space-between;
            font-size: 11px; margin-bottom: 12px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase; letter-spacing: 2px;
        }

        input[type=range] {
            width: 100%; appearance: none;
            background: rgba(255,255,255,0.05);
            height: 4px; border-radius: 2px; outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            appearance: none; width: 20px; height: 20px;
            background: var(--gold); border-radius: 50%;
            cursor: pointer; box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        .action-buttons {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
        }

        .btn-action {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: white; padding: 20px;
            border-radius: 25px; cursor: pointer;
            font-family: 'Urbanist', sans-serif;
            font-size: 11px; font-weight: 600;
            letter-spacing: 2px; transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-active {
            background: var(--gold) !important;
            color: black !important;
        }

        .hidden-ui { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <canvas id="fireCanvas"></canvas>
    <div id="experience-selector" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 100; background: rgba(0,0,0,0.9); padding: 40px; border-radius: 30px; border: 1px solid rgba(212,175,55,0.3); backdrop-filter: blur(20px);">
    <h2 style="font-family: 'Urbanist', sans-serif; letter-spacing: 5px; margin-bottom: 30px; font-size: 18px; color: #d4af37;">¿DÓNDE QUIERES VIVIR AURA?</h2>
    <div style="display: flex; gap: 20px; justify-content: center;">
        <button class="btn-action" id="mode-zen-btn">AQUÍ (CELULAR)</button>
        <button class="btn-action" id="mode-tv-btn">EN MI TV (QR)</button>
    </div>
    <button class="logout-btn" id="cancel-selector" style="margin-top: 25px; display: block; width: 100%;">CANCELAR</button>
</div>
    <div class="ui-overlay" id="ui-layer">
        <header class="header">
            <h1>AURA</h1>
            <button class="logout-btn" id="logout-trigger">Cerrar Sesión</button>
        </header>

        <div class="controls-panel">
            <div class="control-group">
                <div class="control-label"><span>Brillo de la Llama</span><strong id="bright-val">80%</strong></div>
                <input type="range" min="10" max="100" value="80" id="bright-slider">
            </div>

            <div class="control-group">
                <div class="control-label"><span>Fuego (Crujido)</span><strong id="fire-val">50%</strong></div>
                <input type="range" min="0" max="100" value="50" id="fire-slider">
            </div>

            <div class="control-group">
                <div class="control-label"><span>Aire (Viento)</span><strong id="wind-val">30%</strong></div>
                <input type="range" min="0" max="100" value="30" id="wind-slider">
            </div>

           <div class="action-buttons">
                <button class="btn-action" id="audio-toggle">Iniciar Audio</button>
                <button class="btn-action" id="fachada-btn">Fachada</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="script.js"></script>
</body>
</html>
