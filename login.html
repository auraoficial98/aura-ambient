<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura - Acceso Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-primary: #c5a059;
            --gold-glow: rgba(197, 160, 89, 0.3);
            --dark-panel: #1a1c20;
            --bg-black: #0f1012;
            --btn-blue: #001a35;
            --error-red: #ff4d4d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-black);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            background-image: radial-gradient(circle at center, #1e1e1e 0%, #000 100%);
            overflow: hidden;
        }

        /* Contenedor principal estilo móvil/tarjeta */
        .login-card {
            background-color: var(--dark-panel);
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        /* Logo de Llama/Gota */
        .logo-container {
            margin-bottom: 30px;
        }

        .aura-logo-svg {
            width: 60px;
            height: 60px;
            fill: none;
            stroke: var(--gold-primary);
            stroke-width: 1.5;
            filter: drop-shadow(0 0 8px var(--gold-glow));
        }

        .brand-name {
            font-family: 'Urbanist', sans-serif;
            font-size: 42px;
            font-weight: 300;
            letter-spacing: 4px;
            margin-top: 5px;
            color: #fff;
        }

        /* Estilo de Inputs con Glow */
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        /* Contenedores de iconos nativos SVG */
        .input-icon-left {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-group input {
            width: 100%;
            padding: 15px 65px 15px 45px;
            background: rgba(255,255,255,0.03);
            border: 1px solid #444;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        /* BOTÓN VISTA PRELIMINAR TEXTUAL (EVITA ERRORES DE LIBRERÍAS) */
        .input-group .toggle-password-txt {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            cursor: pointer;
            font-family: 'Urbanist', sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            user-select: none;
            z-index: 10;
            transition: color 0.2s;
            padding: 4px;
        }
        .input-group .toggle-password-txt:hover { color: var(--gold-primary); }

        .input-group input:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 10px var(--gold-glow);
            background: rgba(255,255,255,0.06);
        }

        /* Botón Ingresar */
        .btn-ingresar {
            width: 100%;
            padding: 14px;
            background-color: var(--btn-blue);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-ingresar:hover { opacity: 0.9; }

        /* Botón Google */
        .btn-google {
            width: 100%;
            padding: 12px;
            background-color: white;
            color: black;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .google-icon { width: 18px; }

        /* Footer del form */
        .footer-links {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .link-olvido {
            color: var(--gold-primary);
            text-decoration: none;
            font-size: 12px;
            opacity: 0.8;
        }

        .btn-suscribirme {
            background-color: var(--gold-primary);
            color: white;
            padding: 8px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        /* Mensaje de Error */
        .error-message {
            color: var(--error-red);
            font-size: 12px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
            animation: fadeIn 0.3s;
        }

        .copyright {
            position: absolute;
            bottom: -40px;
            left: 0;
            right: 0;
            font-size: 10px;
            color: #555;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

    <div class="login-card" id="card">
        <div class="logo-container">
            <svg class="aura-logo-svg" viewBox="0 0 24 24">
                <path d="M12 2C12 2 19 7.5 19 12.5C19 16.0899 15.866 19 12 19C8.13401 19 5 16.0899 5 12.5C5 10.5 6.5 8 8 6C8 9 9.5 11 11 11C11 11 11 2 12 2Z" />
                <circle cx="12" cy="15" r="1" fill="currentColor" />
            </svg>
            <div class="brand-name">Aura</div>
        </div>

        <div id="errorBox" class="error-message">Contraseña incorrecta, vuelve a intentarlo.</div>

        <!-- CUADRO DE CORREO -->
        <div class="input-group">
            <div class="input-icon-left">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <input type="email" id="username" placeholder="Correo Electrónico">
        </div>

        <!-- CUADRO DE CONTRASEÑA -->
        <div class="input-group">
            <div class="input-icon-left">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            <input type="password" id="password" placeholder="Contraseña">
            <span class="toggle-password-txt" id="eye-txt" onclick="togglePasswordVisibility()">Ver</span>
        </div>

        <!-- BOTÓN INGRESAR (Invocación Directa) -->
        <button class="btn-ingresar" onclick="validate()">Ingresar</button>

        <!-- BOTÓN GOOGLE (Invocación Directa) -->
        <button class="btn-google" onclick="loginConGoogle(event)">
            <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="google-icon" alt="G">
            Continuar con Google
        </button>

        <div class="footer-links">
            <a href="#" class="link-olvido" onclick="recuperarContraseña(event)">Olvide mi contraseña</a>
            <a href="#" class="btn-suscribirme" onclick="abrirSuscripcionRapida(event)">Suscribirme</a>
        </div>

        <div class="copyright">
            Aura © 2024 - Todos los derechos reservados
        </div>
    </div>

    <script>
        // 1. FUNCIÓN INTERNA: Alternar ver contraseña (100% nativo y funcional)
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeTxt = document.getElementById('eye-txt');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeTxt.textContent = 'Ocultar';
            } else {
                passwordInput.type = 'password';
                eyeTxt.textContent = 'Ver';
            }
        }

        // 2. FUNCIÓN INTERNA: Validación y Login Tradicional (Reactivado y Directo)
        function validate() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');
            const card = document.getElementById('card');

            const claveAdminActual = localStorage.getItem('aura_admin_pwd') || '1234';

            // Mantiene compatibilidad total con tu cuenta de desarrollo
            if (user === "admin@aura.com" || user === "admin") {
                if (pass === claveAdminActual) {
                    errorBox.style.display = "none";
                    card.style.opacity = "0";
                    card.style.transform = "scale(0.95)";
                    card.style.transition = "all 0.5s ease";
                    
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
                    return;
                }
            }

            errorBox.style.color = "var(--error-red)";
            errorBox.textContent = "Credenciales incorrectas. Vuelve a intentarlo.";
            errorBox.style.display = "block";
            card.classList.remove('shake');
            void card.offsetWidth; 
            card.classList.add('shake');
            document.getElementById('password').value = "";
        }

        // 3. FUNCIÓN: Continuar con Google
        function loginConGoogle(e) {
            if(e) e.preventDefault();
            const errorBox = document.getElementById('errorBox');
            errorBox.style.color = "var(--gold-primary)";
            errorBox.textContent = "Redirigiendo a Google Auth...";
            errorBox.style.display = "block";
            
            setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
        }

        // 4. FUNCIÓN: Olvidé mi contraseña
        function recuperarContraseña(e) {
            if(e) e.preventDefault();
            const email = document.getElementById('username').value.trim();
            const errorBox = document.getElementById('errorBox');

            if (!email || !email.includes('@')) {
                errorBox.style.color = "var(--error-red)";
                errorBox.textContent = "Por favor, escribe tu Correo Electrónico arriba para enviarte el enlace.";
                errorBox.style.display = "block";
                return;
            }

            errorBox.style.color = "var(--gold-primary)";
            errorBox.textContent = "Simulación: Correo de restablecimiento enviado a " + email;
            errorBox.style.display = "block";
        }

        // 5. FUNCIÓN: Suscribirme
        function abrirSuscripcionRapida(e) {
            if(e) e.preventDefault();
            const errorBox = document.getElementById('errorBox');
            errorBox.style.color = "var(--gold-primary)";
            errorBox.textContent = "Para suscribirte, ingresa con la cuenta de prueba y ve a Ajustes Pro.";
            errorBox.style.display = "block";
        }

        // Atrapa el Enter para ejecutar el Login
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') validate();
        });
    </script>
</body>
</html>
